# Application Configuration
server.port=${PORT:${SERVER_PORT:8080}}
spring.application.name=sustainable-plm-backend

# Supabase PostgreSQL Connection
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP Pool Configuration (Optimized for speed and connection stability)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=3
spring.datasource.hikari.idle-timeout=60000
spring.datasource.hikari.connection-timeout=15000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.keepalive-time=30000

# JPA / Hibernate Configuration
# Strictly validate schema against Supabase PostgreSQL tables
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=false
# Enable JDBC batching for saveAll() and bulk operations
spring.jpa.properties.hibernate.jdbc.batch_size=25
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Response Compression (GZIP for instant network payload transfer)
server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json
server.compression.min-response-size=512

# JWT Configuration
app.jwt.secret=${JWT_SECRET}
# Extended to 7 days (604800000 ms) to prevent automatic logout during active sessions
app.jwt.expiration-ms=604800000

# Actuator Configuration (Render Health Checks)
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true

