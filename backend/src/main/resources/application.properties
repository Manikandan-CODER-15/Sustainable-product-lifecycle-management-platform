# Application Configuration
server.port=${PORT:${SERVER_PORT:8080}}
spring.application.name=sustainable-plm-backend

# Supabase PostgreSQL Connection
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP Pool Configuration (Memory optimization for 512 MB Free Tier)
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000

# JPA / Hibernate Configuration
# Strictly validate schema against Supabase PostgreSQL tables
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT Configuration
app.jwt.secret=${JWT_SECRET}
# Extended to 7 days (604800000 ms) to prevent automatic logout during active sessions
app.jwt.expiration-ms=604800000

# Actuator Configuration (Render Health Checks)
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
